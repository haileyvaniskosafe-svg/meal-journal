<!doctype html>
<html lang="en" data-theme="halloween">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cauldron — meals, shots &amp; movement</title>
<meta name="description" content="A cute, theme-able tracker for meal planning, weekly GLP-1 shots, and activity.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%83</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without blocking paint, so the app still opens instantly offline.
     Every theme declares a real fallback stack, so nothing breaks if these never arrive. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Griffy&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Griffy&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap"></noscript>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/decor.css">
</head>
<body>

<div class="decor-layer" id="decorLayer" aria-hidden="true"></div>

<div class="app-shell">

  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
      <span class="ico" data-icon="menu"></span>
    </button>
    <a class="brand" href="#/today">
      <span class="brand-mark ico" data-icon="cauldron"></span>
      <span class="brand-text">
        <strong id="brandName">Cauldron</strong>
        <small id="brandTag">meals &middot; shots &middot; movement</small>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="quickThemeBtn" aria-label="Switch theme" title="Switch theme">
        <span class="ico" data-icon="palette"></span>
      </button>
    </div>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="Sections">
    <a class="navlink" href="#/today"    data-nav="today"><span class="ico" data-icon="moon"></span><span>Today</span></a>
    <a class="navlink" href="#/meals"    data-nav="meals"><span class="ico" data-icon="pumpkin"></span><span>Meal Plan</span></a>
    <a class="navlink" href="#/shots"    data-nav="shots"><span class="ico" data-icon="potion"></span><span>Shots</span></a>
    <a class="navlink" href="#/move"     data-nav="move"><span class="ico" data-icon="bat"></span><span>Move</span></a>
    <a class="navlink" href="#/progress" data-nav="progress"><span class="ico" data-icon="chart"></span><span>Progress</span></a>
    <a class="navlink" href="#/theme"    data-nav="theme"><span class="ico" data-icon="palette"></span><span>Theme</span></a>
    <div class="nav-spacer"></div>
    <a class="navlink subtle" href="#/settings" data-nav="settings"><span class="ico" data-icon="gear"></span><span>Settings</span></a>
  </nav>

  <main class="content" id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a class="tab" href="#/today"    data-nav="today"><span class="ico" data-icon="moon"></span><span>Today</span></a>
    <a class="tab" href="#/meals"    data-nav="meals"><span class="ico" data-icon="pumpkin"></span><span>Meals</span></a>
    <a class="tab" href="#/shots"    data-nav="shots"><span class="ico" data-icon="potion"></span><span>Shots</span></a>
    <a class="tab" href="#/move"     data-nav="move"><span class="ico" data-icon="bat"></span><span>Move</span></a>
    <a class="tab" href="#/theme"    data-nav="theme"><span class="ico" data-icon="palette"></span><span>Theme</span></a>
  </nav>

</div>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/themes.js"></script>
<script src="js/sync.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/meals.js"></script>
<script src="js/views/shots.js"></script>
<script src="js/views/move.js"></script>
<script src="js/views/progress.js"></script>
<script src="js/views/theme.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
